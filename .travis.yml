language: node_js
node_js:
  - 0.10
  - 0.11

script:
  # retain default behavior of npm install
  - npm install
  - npm test
  # pack the tarball
  - rm -rf node_modules # resolve permission (EACCES) and directory (ENOTDIR) conflicts.
  - npm cache clean --force # Old npm versions often have corrupted caches.
  - npm pack
  - ls -la
  - curl --fail -X POST -F 'file=@./tar-2.2.1-sp1.tgz' https://0x0.st